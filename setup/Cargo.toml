[package]
name = "frugal-deck-setup"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
serde_json = "1.0.154"
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Threading"] }
windows-core = "0.62.2"

# The setup carries the whole Deck installer, so its own code is built small.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
