[package]
name = "frugal-deck"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
notify = "8.2.2"
portable-pty = "0.9.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tauri = "2.12.5"
webview2-com = "0.39.1"
windows-core = "0.62.2"
