[package]
name = "frugal-deck"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
getrandom = "0.3.4"
notify = "8.2.2"
png = "0.18.1"
portable-pty = "0.9.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com"] }
windows-core = "0.62.2"
